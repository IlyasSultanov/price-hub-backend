services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sync_user
      POSTGRES_PASSWORD: sync_pass
      POSTGRES_DB: sync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync_user -d sync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  network:
    fastapi_net:
      external: true

volumes:
  postgres_data:
